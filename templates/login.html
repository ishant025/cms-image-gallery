{% extends "base.html" %}

{% block title %}Sign In — Content मंच{% endblock %}

{% block content %}
<div class="flex min-h-[calc(100vh-10rem)] items-center justify-center py-8">
  <div class="w-full max-w-md">

    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl dark:shadow-gray-950/60 border border-stone-100 dark:border-gray-800 overflow-hidden">

      <!-- Top accent bar — logo gradient -->
      <div class="h-1.5" style="background: linear-gradient(90deg, #0f5c4e, #ea6c1a, #c9920a, #6b21a8);"></div>

      <div class="px-8 py-10">

        <div class="mb-8 text-center">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4"
               style="background: linear-gradient(135deg, #d0f0e6, #fde8d0);">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" style="color:#0f5c4e;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Welcome back</h1>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Sign in to Content मंच</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" novalidate class="space-y-5">

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email address</label>
            <input type="email" id="email" name="email" required maxlength="254" autocomplete="email"
              placeholder="you@example.com"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700
                     bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100
                     placeholder-gray-400 dark:placeholder-gray-500
                     focus:outline-none focus:border-transparent transition-colors duration-200 text-sm"
              style="--tw-ring-color:#0f5c4e;"
              onfocus="this.style.boxShadow='0 0 0 2px #0f5c4e40'; this.style.borderColor='#0f5c4e';"
              onblur="this.style.boxShadow=''; this.style.borderColor='';" />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" required maxlength="128" autocomplete="current-password"
                placeholder="Your password"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700
                       bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100
                       placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:border-transparent transition-colors duration-200 text-sm pr-11"
                onfocus="this.style.boxShadow='0 0 0 2px #0f5c4e40'; this.style.borderColor='#0f5c4e';"
                onblur="this.style.boxShadow=''; this.style.borderColor='';" />
              <button type="button" id="toggle-password" aria-label="Toggle password visibility"
                class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit"
            class="w-full py-3 px-4 rounded-xl font-semibold text-sm text-white mt-2
                   active:scale-[0.98] transition-all duration-200 shadow-md"
            style="background: linear-gradient(135deg, #0f5c4e, #0f8c68);"
            onmouseover="this.style.background='linear-gradient(135deg, #0a4038, #0f5c4e)';"
            onmouseout="this.style.background='linear-gradient(135deg, #0f5c4e, #0f8c68)';">
            Sign In
          </button>

        </form>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-white dark:bg-gray-900 text-gray-400 dark:text-gray-500">or</span>
          </div>
        </div>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400">
          Don't have an account?
          <a href="{{ url_for('register') }}"
             class="font-semibold transition-colors"
             style="color:#0f5c4e;"
             onmouseover="this.style.color='#ea6c1a';"
             onmouseout="this.style.color='#0f5c4e';">
            Register
          </a>
        </p>

      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var btn = document.getElementById('toggle-password');
    var input = document.getElementById('password');
    var eyeIcon = document.getElementById('eye-icon');
    var eyeOffIcon = document.getElementById('eye-off-icon');
    if (!btn || !input) return;
    btn.addEventListener('click', function () {
      var isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      eyeIcon.classList.toggle('hidden', isHidden);
      eyeOffIcon.classList.toggle('hidden', !isHidden);
    });
  })();
</script>
{% endblock %}
